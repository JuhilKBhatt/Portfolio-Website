server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Enable Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/x-javascript
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # Hide Nginx version from Server response header
    server_tokens off;

    # Hashed Vite assets - cache for 1 year immutable at browser and Cloudflare edge
    location /assets/ {
        expires 1y;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, s-maxage=31536000, immutable" always;
        try_files $uri =404;
    }

    # Static media, fonts, and data - cache for 30 days at browser and Cloudflare edge
    location ~* \.(?:webp|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot|json)$ {
        expires 30d;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=2592000, s-maxage=2592000" always;
        try_files $uri =404;
    }

    # Reverse proxy for backend API - keeps traffic on Docker internal network
    location /api/ {
        proxy_pass http://flask-server:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering on;
    }

    # SPA routing fallback
    # s-maxage=3600 allows Cloudflare edge to serve index.html without hitting home server,
    # while max-age=0, must-revalidate ensures browsers re-check on refresh
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://res.cloudinary.com https://avatars.githubusercontent.com; media-src 'self' https://res.cloudinary.com; connect-src 'self' https://api.github.com; frame-ancestors 'self';" always;
        add_header Cache-Control "public, max-age=0, s-maxage=3600, must-revalidate" always;
    }
}
