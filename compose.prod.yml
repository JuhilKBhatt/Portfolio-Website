services:
  flask-server:
    build:
      context: ./flask-server
      dockerfile: Dockerfile
    ports:
      # Bind to localhost loopback so backend is not exposed directly to the public internet
      - "127.0.0.1:5001:5001"
    restart: unless-stopped
    environment:
      # Ensure Debug is turned off in production
      - FLASK_DEBUG=0
      # Restrict CORS to only allow requests from the frontend domain
      - CORS_ORIGINS=http://localhost:3000
    env_file:
      - ./flask-server/.env

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        # Empty string lets frontend make same-origin /api/ requests through Nginx reverse proxy
        - VITE_FLASK_API_URL=
    restart: unless-stopped
    ports:
      # Map host port 3000 to the container's unprivileged port 8080 (Nginx)
      - "3000:8080"
    depends_on:
      - flask-server
