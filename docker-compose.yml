services:
  flask-server:
    build: ./flask-server
    ports:
      # Bind to localhost only so backend is not exposed directly to public internet
      - "127.0.0.1:5001:5001"
    restart: unless-stopped
    environment:
      # Ensure Debug is turned off in production
      - FLASK_DEBUG=0
      # Restrict CORS to only allow requests from the frontend domain
      - CORS_ORIGINS=http://localhost:3000
    env_file:
      # This loads the env vars from your existing .env file
      - ./flask-server/.env

  client:
    build:
      context: ./client
      args:
        # Empty string lets frontend make same-origin /api/ requests through Nginx
        - VITE_FLASK_API_URL=
    restart: unless-stopped
    ports:
      # Map host port 3000 to the container's unprivileged port 8080
      - "3000:8080"
    depends_on:
      - flask-server
